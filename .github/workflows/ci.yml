name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version: '1.27.1' }
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
      - run: staticcheck ./...
      - run: go test -race ./...
